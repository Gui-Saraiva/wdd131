<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <meta name="description" content="Formulário de avaliação de produtos de uma a cinco estrelas. Você faz a avaliação e preenche seus dados se assim desejar. Seu feedback é importante para nós.">
    <meta name="author" content="Guilherme Fagundes Saraiva">
    <link rel="stylesheet" href="estilos/formulario-mobile.css">
    <script src="scripts/formulario.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div><h1>Avaliação do Produto</h1></div>
    </header>

    <main>
        <form method="get" action="avaliacao.html" class="formulario">
            <label for="produto">Nome do Produto:
                <select id="produto" name="produtos" required>
                    <option value="" disabled selected>Selecione um produto...</option>
                </select>
            </label>

            <label>Classificação Geral:</label>
            <div class="radios">
                <input type="radio" name="stars" id="five-star" value="5" required>
                <label for="five-star"></label>

                <input type="radio" name="stars" id="four-star" value="4" required>
                <label for="four-star"></label>

                <input type="radio" name="stars" id="three-star" value="3" required>
                <label for="three-star"></label>

                <input type="radio" name="stars" id="two-star" value="2" required>
                <label for="two-star"></label>

                <input type="radio" name="stars" id="one-star" value="1" required>
                <label for="one-star"></label>
            </div>

            <label for="data">Data de Instalação
                <input type="date" name="data" id="data" required>
            </label>

            <div class="recursos">Marque os recursos úteis para você:</div>
            <div class="checkbox-container">
                <label for="durabilidade" class="text-checkbox"><input type="checkbox" name="durabilidade" value="sim" id="durabilidade">Durabilidade</label>
                <label for="facilidade" class="text-checkbox"><input type="checkbox" name="facilidade" value="sim" id="facilidade">Facilidade de Uso</label>
                <label for="desempenho" class="text-checkbox"><input type="checkbox" name="desempenho" value="sim" id="desempenho">Desempenho</label>
                <label for="design" class="text-checkbox"><input type="checkbox" name="design" value="sim" id="design">Design</label>
            </div>

            <label for="msg">Avaliação Escrita: <span>(Opcional)</span>                
                <textarea id="msg" name="usuario_mensagem"></textarea>
            </label>

            <label for="nome-usuario">Seu Nome: <span>(Opcional)</span>
                <input type="text" name="nome-usuario" id="nome-usuario">
            </label>

            <input type="submit" value="Publicar Avaliação">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="anoAtual"></span> &#10070; Guilherme F. Saraiva &#10070; São Paulo, Brasil</p>
        <p id="ultimaMoficacao"></p>
    </footer>
</body>
</html>
